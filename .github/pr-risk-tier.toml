size_limit = 400
default_tier = 1
test_paths = ["tests/**"]

[[rule]]
id = "docs_only"
tier = 0
paths = ["**/*.md", "LICENSE"]

[[rule]]
id = "comment_contract"
tier = 2
paths = ["pr_risk_tier/render.py", "pr_risk_tier/rules.py"]

[[rule]]
id = "infrastructure"
tier = 3
paths = ["action.yml", ".github/workflows/**", ".github/pr-risk-tier.toml", "pyproject.toml", "requirements-dev.txt"]
