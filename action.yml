name: pr-risk-tier
description: Comenta em cada pull request um pacote de evidências com tier de risco determinístico.
author: leonardosf98

inputs:
  rules-file:
    description: Caminho do arquivo de regras no repositório que usa a action.
    default: .github/pr-risk-tier.toml
  github-token:
    description: Token com permissões pull-requests:write e actions:read.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Build evidence comment
      id: build
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RULES_FILE: ${{ inputs.rules-file }}
        WORK_DIR: ${{ runner.temp }}/pr-risk-tier
        COMMENT_FILE: ${{ runner.temp }}/pr-risk-tier.md
      run: |
        if [ -z "$PR_NUMBER" ]; then
          echo "::error::pr-risk-tier só roda em eventos pull_request."
          exit 1
        fi
        mkdir -p "$WORK_DIR"
        git -c core.quotePath=false diff --numstat --no-renames "$BASE_SHA...$HEAD_SHA" > "$WORK_DIR/numstat.txt"
        git -c core.quotePath=false ls-files > "$WORK_DIR/repo-files.txt"
        jobs_url="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
        if ! gh api "$jobs_url" > "$WORK_DIR/jobs.json"; then
          echo "::warning::pr-risk-tier não conseguiu ler os jobs do CI; dê ao job a permissão actions: read."
          rm -f "$WORK_DIR/jobs.json"
        fi
        jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$WORK_DIR/body.md"
        status=0
        PYTHONPATH="$GITHUB_ACTION_PATH" python3 -m pr_risk_tier \
          --rules "$RULES_FILE" --numstat "$WORK_DIR/numstat.txt" \
          --repo-files "$WORK_DIR/repo-files.txt" --jobs "$WORK_DIR/jobs.json" \
          --body "$WORK_DIR/body.md" --repo-root . \
          --output "$COMMENT_FILE" || status=$?
        if [ "$status" -eq 2 ]; then
          exit 2
        fi
        cat "$COMMENT_FILE" >> "$GITHUB_STEP_SUMMARY"
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Publish evidence comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_FILE: ${{ runner.temp }}/pr-risk-tier.md
      run: |
        comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- pr-risk-tier:comment -->")) | .id' | head -n 1)
        if [ -n "$comment_id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
            -F body=@"$COMMENT_FILE" > /dev/null
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -F body=@"$COMMENT_FILE" > /dev/null
        fi

    - name: Fail on invalid agent evidence
      if: steps.build.outputs.status != '0'
      shell: bash
      run: |
        echo "::error::O bloco do agente é inválido ou cita teste inexistente. Veja o comentário da PR."
        exit 1
